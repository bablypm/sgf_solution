<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Green Farms | Under Construction</title>
    <meta name="description" content="Sun Green Farms is building something fresh and sustainable. Please check back soon!">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Sun Green Farms - Under Construction">
    <meta property="og:description" content="We're working on something fresh and natural. Check back soon!">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #FFFBEF; /* soft off-white background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            margin: 0 auto;
        }

        .logo {
            width: 100px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
            color: #388E3C; /* dark green */
        }

        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: #F4A300; /* sun yellow */
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #555;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin: 2rem 0;
        }

        .progress-fill {
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #8BC34A, #388E3C);
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.7;
            }

            to {
                opacity: 1;
            }
        }

        .contact-info {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #333;
        }

            .contact-info a {
                color: #F4A300;
                text-decoration: none;
                font-weight: bold;
            }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            opacity: 0.7;
            color: #333;
        }

        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/Icon_Profile_pic.png" alt="Sun Green Farms Logo" class="logo">
        <h1>Sun Green Farms</h1>
        <p class="subtitle">Our Website is Under Construction</p>
        <p class="description">
            We’re working on something fresh, natural, and sustainable.
            Please check back soon to see what we’ve been growing!
        </p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="contact-info">
            <p>Have questions? Email us at <a href="mailto:sungreenfarmsorganic@gmail.com">sungreenfarmsorganic@gmail.com</a></p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Sun Green Farms. All rights reserved.</p>
    </div>
</body>
</html>
